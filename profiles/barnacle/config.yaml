# Snakemake profile for barnacle (UCSD / Knight Lab HPC cluster).
#
# Pattern: the SLURM EXECUTOR. Snakemake submits each rule as its own SLURM
# job (one sbatch per job) and tracks them to completion. This parallelizes
# across the cluster far better than the old "single inline SBATCH job runs
# Snakemake with --cores" pattern.
#
# Requires the executor plugin in the environment running Snakemake:
#   pip install snakemake-executor-plugin-slurm
#
# Usage: run Snakemake from a login-node tmux/screen session (the Snakemake
# process is tiny — it only submits and polls the per-rule SLURM jobs).
# Singularity is system-wide on barnacle (/usr/bin/singularity, on every node,
# no module needed); just point scratch/cache dirs at /ddn_scratch/$USER (see the
# README "Running conduit-ascent on Barnacle" section), then:
#       snakemake --profile profiles/barnacle \
#                 --configfile experiments/<exp>/config/<method>.yaml
#
# Site-specific knobs (partition / account): barnacle's default partition
# worked for the old inline-job setup with neither specified, so they are
# left unset here and the cluster default is used. If your cluster requires
# them, uncomment slurm_partition / slurm_account under default-resources.
#
# Other clusters: there is deliberately no generic SLURM profile, because
# scratch paths, binds, partitions and per-rule memory are all site-specific.
# Copy this directory to profiles/<your-cluster>/ and adapt it to your site.

executor: slurm
use-singularity: true
rerun-incomplete: true

# /ddn_scratch is the cluster scratch filesystem that holds TMPDIR,
# XDG_CACHE_HOME, and Snakemake's output cache. Apptainer/Singularity doesn't
# auto-bind it, so containers can't see files under /ddn_scratch without this.
# The pre-run setup exports env-var paths under /ddn_scratch/$USER; this
# exposes the whole tree so those paths resolve inside rule containers.
singularity-args: "--bind /ddn_scratch"

# Cap simultaneously-queued SLURM jobs to stay friendly to the scheduler.
jobs: 50

# Use the greedy scheduler instead of Snakemake's default ILP scheduler. The
# ILP scheduler solves a linear program over ALL currently-ready jobs each
# cycle to pick the optimal batch to submit. Per-genome fan-out rules
# (download_mgnify_genome, predict_orfs_with_prodigal) make thousands of jobs
# ready at once — e.g. ~4,744 for MGnify human-gut v2.0.2 — and the pulp/CoinOR
# solver's memory + CPU blow up, getting the login-node driver process
# SIGKILL'd (bare "Killed", OOM/Arbiter2). Greedy just fills open job slots, so
# driver footprint no longer scales with the number of ready jobs.
scheduler: greedy

# Retry transient failures (node OOM, preemption).
restart-times: 2

# Per-job thread ceiling. In executor mode --cores limits threads PER job, and
# `workflow.cores` resolves to this value. Set to a full node's width (64) so
# rules that declare `threads: workflow.cores` (DIA-NN library generation and
# searches, eggNOG, MetaPhlAn) can use the whole node; per-raw search rules stay
# at `min(8, workflow.cores) = 8`. A job can't span nodes, so 64 is the true
# ceiling.
cores: 64

# Cluster-wide default resources.
#   - The plugin maps each rule's `threads` → cpus_per_task automatically.
#   - Memory: barnacle nodes are uniform at 64 cores / 514 GB (~8 GB/core), so
#     mem scales at 8000 MB per cpu — a 16-cpu rule gets 128 GB. `* attempt`
#     bumps memory on each retry (with restart-times: 2) so an OOM self-corrects.
#     min(..., 490000) caps every request ~24 GB below the node's 514 GB
#     allocatable: that leaves OS / page-cache headroom (under cgroups a job's
#     file-read cache counts against its own limit, and DIA-NN is I/O-heavy) and
#     keeps even a 64-cpu rule's retries schedulable. Written as `mem_mb` rather
#     than `mem_mb_per_cpu` so the per-rule mem_mb overrides below don't collide
#     (SLURM rejects --mem together with --mem-per-cpu).
#   - runtime is intentionally NOT set: the default `short` partition allows
#     14 days (and `qiita` is unlimited), which comfortably covers even the
#     multi-day build_sequence_index rebuild. Add `runtime` only if a real
#     wall-clock measurement later shows a rule needs a cap/guarantee.
default-resources:
  # slurm_partition: "<partition>"   # default is `short` (14-day limit); set to
  #                                  # `qiita` for unlimited-walltime jobs.
  # slurm_account: "<account>"       # uncomment if your cluster requires one
  mem_mb: min(8000 * threads * attempt, 490000)

# Give DIA-NN spectral-library prediction a full node — it's one of the heaviest
# steps and its memory scales with database size. Explicit so the intent holds
# regardless of the global `cores` ceiling. (With cores: 64 the thread count is
# already 64 via workflow.cores; set-threads documents it.) 490000 MB leaves the
# ~24 GB node headroom; flat, not * attempt, since it's already at the cap.
set-threads:
  generate_diann_spectral_library: 64
  # Pin back the one workflow.cores rule that isn't cpu-parallel: it's dominated
  # by single-threaded awk over the peptide tables (only `taxonkit lineage -j`
  # uses threads), so a full node is wasted. 8 cpus also sets its default memory
  # to 64 GB (8000 * 8), ample for streaming awk; `* attempt` escalates if not.
  # (The DIA-NN *_combine rules are left at full width — each is a real threaded
  # `diann --use-quant` pass and runs as a single post-search job.)
  build_effective_detection_rank_db: 8
  # bakta annotates ONE isolate genome per job (~5 MB); it's multithreaded but
  # doesn't scale to a whole node. At workflow.cores=64 each of the N genome jobs
  # demanded a full node and stacked up in the queue on a busy cluster. 8 cpus
  # lets ~8 pack per node and schedule promptly.
  annotate_genomes_with_bakta: 8
  # run_metaphlan is the same pattern — one fastq sample per job — so a full node
  # per sample would stack the queue on a busy cluster. Pin to 8 (matches the
  # per-raw DIA-NN search rules). Preemptive: not exercised by the genomes method,
  # applies when you run the metaphlan search-space method.
  run_metaphlan: 8

# Per-rule first-attempt memory for the heavy, low-cpu rules the per-core default
# would starve (they run on ~1 cpu, so 8 GB otherwise). 514 GB nodes give ample
# headroom, so these start generous and still escalate via `* attempt`.
# NOTE: these starting values are estimates — replace with benchmark numbers
# (add `benchmark:` directives) after a real run.
set-resources:
  generate_diann_spectral_library:       # DIA-NN library prediction — full node
    mem_mb: 490000
  build_sequence_index:                  # UMGAP build + giant external sort
    mem_mb: 64000 * attempt
  build_conduit:                         # assembles the full conduit S4 object
    mem_mb: 32000 * attempt
  generate_qfeatures_from_diann_parquet: # loads the full DIA-NN matrix into R
    mem_mb: 32000 * attempt
  add_annotations_to_qfeatures:
    mem_mb: 32000 * attempt
  get_annotations_from_uniprot:          # network fetch + parse
    mem_mb: 16000 * attempt
