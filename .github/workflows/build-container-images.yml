name: Build and push container images

on:
  push:
    branches: [main, develop]
    paths:
      # Anything in a container's directory: the Dockerfile or a file it COPYs
      # (e.g. bakta's conda-linux-64.lock).
      - 'containers/**'
  workflow_dispatch:
    inputs:
      containers:
        description: 'Which containers to (re)build. Comma-separated tool names (e.g. "bakta,diann_runtime") or "all". Note: there is no "diann" image — DIA-NN is user-supplied (see issue #63); diann_runtime carries only its host dependencies.'
        required: true
        default: 'all'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine which Dockerfiles to build
        id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            req='${{ github.event.inputs.containers }}'
            if [ "$req" = "all" ]; then
              files=$(ls -1 containers/*/Dockerfile)
            else
              files=""
              for tool in $(echo "$req" | tr ',' ' '); do
                f="containers/${tool}/Dockerfile"
                if [ ! -f "$f" ]; then
                  echo "ERROR: no Dockerfile at $f" >&2
                  exit 1
                fi
                files="${files}${f}"$'\n'
              done
            fi
          else
            # push event: rebuild every image whose directory changed in this
            # commit, whether the Dockerfile or a file it COPYs (e.g. bakta's
            # conda-linux-64.lock). A removed container (e.g. the DIA-NN image
            # retired in #63) has no Dockerfile left, so it is skipped.
            files=$(git diff --name-only HEAD~1 HEAD -- 'containers/' \
              | awk -F/ 'NF >= 3 { print "containers/" $2 "/Dockerfile" }' \
              | sort -u \
              | while IFS= read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)
          fi
          {
            echo 'files<<EOF'
            echo "$files"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push selected images
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || { echo "Skipping $f (no longer present)"; continue; }
            tool=$(echo "$f" | awk -F'/' '{print $2}')
            echo "Building $tool:$sha from $f"
            docker buildx build \
              --file "$f" \
              --tag ${{ secrets.DOCKERHUB_USERNAME }}/${tool}:${sha} \
              --push \
              "containers/${tool}"
          done <<< "${{ steps.select.outputs.files }}"
