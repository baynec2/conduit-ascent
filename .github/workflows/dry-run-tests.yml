name: Snakemake dry-run tests

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  dry-runs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "snakemake>=8" pandas

      - name: Run dry-run tests
        run: bash tests/run_dry_runs.sh
