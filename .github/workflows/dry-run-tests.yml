name: Snakemake dry-run tests

on:
  push:
    branches: [main, develop, testing]
  pull_request:
    branches: [main, develop]

jobs:
  dry-runs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "snakemake>=8" pandas
          sudo apt-get install -y graphviz

      - name: Run dry-run tests
        run: bash tests/run_dry_runs.sh

      - name: Generate DAGs
        run: |
          mkdir -p dag_output
          for method in ncbi_taxonomy_id uniprot_proteome_id peptidotyping MAGs metaphlan; do
            snakemake \
              --snakefile Snakefile \
              --configfile "tests/configs/integration_test_${method}.yaml" \
              --dag \
              --cores 1 \
              --quiet 2>/dev/null \
            | dot -Tsvg > "dag_output/${method}.svg"
          done

      - name: Upload DAGs
        uses: actions/upload-artifact@v4
        with:
          name: workflow-dags
          path: dag_output/
