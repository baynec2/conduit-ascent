name: Snakemake dry-run tests

on:
  push:
    branches: [main, develop, testing]
  pull_request:
    branches: [main, develop]

jobs:
  dry-runs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "snakemake>=9,<10" pandas
          sudo apt-get install -y graphviz

      - name: Run lint
        # Lint emits advisory style suggestions (e.g., "long run directive",
        # "mixed rules and functions") in addition to real errors. Snakemake
        # can't selectively suppress them, so this step is informational
        # only — output is visible in the run log but doesn't fail CI.
        continue-on-error: true
        run: snakemake --lint --configfile tests/configs/integration_test_uniprot_proteome_id.yaml

      - name: Run dry-run tests
        run: bash tests/run_dry_runs.sh

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Install R script test dependencies
        run: Rscript -e "install.packages(c('readr','dplyr','stringr'), repos='https://cloud.r-project.org')"

      - name: Run R script unit tests
        run: Rscript tests/scripts/test_parse_eggnogmapper_annotations.R

      - name: Generate DAGs
        run: |
          mkdir -p dag_output
          for method in ncbi_taxonomy_id uniprot_proteome_id peptidotyping unipept_hapid MAGs metaphlan hapid; do
            snakemake \
              --snakefile Snakefile \
              --configfile "tests/configs/integration_test_${method}.yaml" \
              --dag \
              --cores 1 \
              --quiet 2>/dev/null \
            | dot -Tsvg > "dag_output/${method}.svg"
          done

      - name: Upload DAGs
        uses: actions/upload-artifact@v4
        with:
          name: workflow-dags
          path: dag_output/
