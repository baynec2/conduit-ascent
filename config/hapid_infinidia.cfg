# DIA-NN config for HAPiID-style marker-gene profiling in InfiniDIA mode.
# Mirrors diann_library_search_base.cfg with --pre-search --pre-filter added.
# Per-rule digest parameters (--cut, --missed-cleavages, --min-pep-len,
# --max-pep-len) are passed inline by the calling Snakemake rule.
--qvalue 0.01
--unimod4
--mass-acc 10
--mass-acc-ms1 4
--species-ids
--pre-search
--pre-filter
