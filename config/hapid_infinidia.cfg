# Stage-agnostic DIA-NN baseline for HAPiID-style marker-gene profiling.
# Per-rule digest parameters (--cut, --missed-cleavages, --min-pep-len,
# --max-pep-len) are passed inline by the calling Snakemake rule, as are
# the InfinDIA flags (--pre-search --pre-filter) which apply only to the
# stage-1 empirical-library build.
--qvalue 0.01
--unimod4
--mass-acc 10
--mass-acc-ms1 4
--species-ids
