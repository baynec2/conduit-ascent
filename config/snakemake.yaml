# =============================================================================
#  conduit-ascent base configuration
# -----------------------------------------------------------------------------
#  This file is the source of default values for every run. The Snakefile loads
#  it automatically via `configfile:`. Any experiment-specific --configfile
#  merges on top (later wins), and --config key=value wins over both. See
#  memory-aid "precedence cheat sheet" in the docs if this stops feeling
#  obvious.
#
#  Keys are grouped by WHICH METHOD NEEDS THEM — jump to the section for the
#  search_space_method you're running. Truly-shared keys are at the top.
# =============================================================================


# =============================================================================
#  SHARED — all methods
# =============================================================================

# --- Required per run (experiment YAML overrides these) ---
# Name of the experiment; used to locate experiments/<experiment>/ and namespace outputs.
experiment:
# Name of this analysis run; outputs land under experiments/<experiment>/runs/<run_name>/.
# Multiple runs with different configs/methods can coexist in the same experiment dir.
run_name:
# Which search-space method to use. Options:
#   ncbi_taxonomy_id     user-provided NCBI taxon IDs → UniProt proteomes
#   uniprot_proteome_id  user-provided UniProt proteome IDs
#   unipept_peptidotyping  UMGAP-LCA peptide-based species detection
#   unipept_hapiid         HAPiID-style GO-filtered first-pass
#   genome_peptidotyping   peptidotyping on user-provided genomes (no UniProt)
#   metaphlan            MetaPhlAn profiling → NCBI taxon IDs
#   genomes              all user-provided genome FASTAs (MAGs or reference), no selection
#                        (the old name "MAGs" is still accepted as a deprecated alias)
#   hapiid               HAPiID marker-gene profiling → greedy genome selection
#                        (the old names "hapid"/"unipept_hapid" are still accepted as
#                         deprecated aliases; on-disk cache/resource paths keep "hapid")
search_space_method: ncbi_taxonomy_id
# Sample annotation file (relative to experiment dir).
# NOTE: build_conduit.smk hardcodes input/sample_annotation.txt and ignores this
# key, so pointing it elsewhere passes the Snakefile's checks and then fails in
# generate_qfeatures_from_diann_parquet. Treat it as fixed until that is fixed.
sample_annotation: input/sample_annotation.txt

# --- Container images ---
# Pinned by DIGEST, not by tag. Both halves of that matter:
#
#   1. A tag cannot name this commit. CI tags each image with the sha of the
#      commit that built it, and the image for a commit does not exist until
#      after that commit is pushed — so a tag here always names some EARLIER
#      commit and looks perpetually out of date. Bumping it just makes a new
#      commit and recreates the gap. A digest has no commit in it to lag.
#
#   2. These builds are not reproducible, so a tag is not a version. Almost
#      every Dockerfile below resolves its packages at build time — `bakta`,
#      `metaphlan` and `fraggenescan_hmmer` install their tools with no
#      version at all, `umgap` curls whatever rustup ships today, and
#      `diann_runtime` takes dotnet-sdk-8.0 as a major version. Two builds
#      of the SAME Dockerfile are therefore different images: compare
#      fraggenescan_hmmer at 660f4cb and f5f961d — byte-identical source,
#      two digests. Without a digest, which metaphlan profiled your samples
#      depends on which build happened to be tagged last.
#
# The tag each digest came from is in the comment beside it, because that is
# the part a human can read and grep the CI logs for. To move one, take the
# digest of the tag you want — the multi-arch index digest, not a
# per-platform one:
#
#   docker buildx imagetools inspect baynec2/<image>:<sha>
#
# Digests fix WHICH BUILD you get. They do not make a rebuild reproducible —
# that needs versions pinned inside the Dockerfiles, which is tracked
# separately. eggnog-mapper=2.1.12 is currently the only one that does it.
containers:
  # a5cfeae
  conduitr:           "docker://baynec2/conduitr@sha256:919a3014f3177d1a70054b7cb0083a1ab726637831b3eae0ae01717a1fd45a59"
  # Runtime deps (.NET 8, libgomp, locales) for a user-supplied DIA-NN — no
  # DIA-NN inside. There is deliberately no `diann` key here: the DIA-NN
  # container is resolved from `diann_path` at parse time (see below) and
  # written into containers.diann by modules/_shared/diann_env.py.
  # 14165ea
  diann_runtime:      "docker://baynec2/diann_runtime@sha256:6f9bb07a6b00180edabac2a730ef51274e9e4b96c7e954666be9a1e5d7ff3bbb"
  # f65548d
  bakta:              "docker://baynec2/bakta@sha256:cb9692a812b897b1001fa54b3b4f24484df330cdab1d583d69175e3595aafb81"
  # 14165ea
  metaphlan:          "docker://baynec2/metaphlan@sha256:079f46bb3f82f8491e04af6be1110b74b5aed3b675ddca98c4ff7d1660b9fcc5"
  # 14165ea
  eggnogmapper:       "docker://baynec2/eggnogmapper@sha256:340601fdf5a43d6712e060ca71d84b758b657ca2a686bfed6c80a54626ccd3f3"
  # 14165ea
  umgap:              "docker://baynec2/umgap@sha256:e858b171ead56c51bb0c0257fbb6d78a960cf5b823084eaf58c3883faba7ce30"
  # 14165ea
  fraggenescan_hmmer: "docker://baynec2/fraggenescan_hmmer@sha256:63b9c5b8bc3c72ed242d4e2feb13540f8750a0bc33933d44acd082388ca3e222"
  # 0.20.0--h9ee0642_1 — biocontainers tags already carry a build hash, so
  # this one was effectively immutable already; pinned by digest anyway so
  # there is one rule here rather than one rule and an exception.
  taxonkit:           "docker://quay.io/biocontainers/taxonkit@sha256:c27f1ecebde5e98ba09693dd3046814464a9d3ad2c944fba5a0be560ee643c7d"

# --- DIA-NN installation (user-supplied) ---
# conduit-ascent does not distribute DIA-NN. Its licence permits one backup
# copy and forbids sublicensing, so the binary cannot ship in a public image
# (issue #63); you download it from
#   https://github.com/vdemichev/DiaNN/releases
# and accept its terms yourself. Free for academic use; commercial use needs a
# licence from the authors.
#
# One key, three autodetected shapes:
#   A. a directory holding diann-linux (recommended) — bind-mounted into the
#      containers.diann_runtime image, which supplies .NET 8 + libgomp
#   B. an executable file (e.g. DIA-NN.AppImage) — run on the host, no container
#   C. "docker://…" or "….sif" — a full image you built yourself, used as-is
#
# Resolution order, first wins:
#   snakemake --config diann_path=...   >   $CONDUIT_DIANN_PATH   >   this key
#
# The default keeps the install under resources/, which is inside the working
# directory and therefore already visible inside the container — no extra
# apptainer bind is needed. An out-of-tree path gets one added automatically.
diann_path: resources/diann/diann-2.5.0

# Compatibility gate for the user-supplied DIA-NN, run once before any search:
#   strict  fail the run if the version is too old or any flag we pass is
#           unsupported (DIA-NN ignores unknown flags rather than erroring, so
#           an unchecked mismatch silently changes the science)
#   warn    report the same findings and continue
#   off     skip the check entirely
diann_compat_check: strict

# --- DIA-NN cfg-file pointers (rarely changed per-experiment) ---
# Every cfg below is snapshotted into RUN_DIR/config/ at run start (see
# modules/setup/setup.smk); consuming rules read the snapshot, so the cfg
# used by a run is reproducibly frozen with the run. Override any of these
# keys in an experiment YAML to swap in a variant cfg (e.g. proteoform-mode
# peptidotyping) without editing the rule.
# Shared flags for spectral-library generation. Per-rule digest flags are inline in module rules.
diann_spectral_library_base_config: config/diann_spectral_library_base.cfg
# Shared flags for library-based DIA-NN searches (HAPiID-style).
diann_library_search_base_config: config/diann_library_search_base.cfg
# Shared flags for the peptidotyping InfiniDIA DIA-NN search (both passes).
peptidotyping_infinidia_config: config/peptidotyping_infinidia.cfg
# Shared flags for the peptidotyping standard-mode DIA-NN search (both passes).
# Used when *_peptidotyping_search_mode == "standard".
peptidotyping_standard_config: config/peptidotyping_standard.cfg
# Shared flags for the HAPiID InfiniDIA DIA-NN search.
hapiid_infinidia_config: config/hapid_infinidia.cfg
# Main DIA-NN search mode. Options:
#   standard   use run_diann_config below
#   infinidia  use config/run_diann_infinidia.cfg (--pre-search --pre-filter)
diann_search_mode: "standard"
# Main DIA-NN search config. Used when diann_search_mode == "standard".
run_diann_config: config/run_diann.cfg

# Per-method search mode for multi-pass search-space DIA-NN searches.
# Independent of diann_search_mode (which controls only the main search).
# Options for each:  standard | infinidia
#   standard   build a predicted spectral library first, then search with --lib
#   infinidia  search FASTA directly with --pre-search --pre-filter
# Defaults preserve historical behavior of each method.
unipept_peptidotyping_search_mode: "infinidia"
genome_peptidotyping_search_mode:  "infinidia"
unipept_hapiid_search_mode:        "standard"
hapiid_search_mode:                "standard"

# --- Host / target filtering (optional; applies to every method) ---
# Append an extra UniProt proteome to the database (e.g., a host reference).
# FALSE = none.  Examples: Human = UP000005640, Mouse C57/BL6 = UP000000589.
append_additional_proteome_id: FALSE
# Append an extra NCBI taxon ID to the database (same idea, different key).
# FALSE = none.  Examples: Human = 9606, Mouse = 10090.
# NOTE: on the genome-sourced methods (genomes/hapiid/genome_peptidotyping) this
# and append_additional_proteome_id are mutually exclusive — setting both raises
# in append_additional_organisms_or_proteomes.R. On the UniProt-based methods
# they apply at different stages and stack.
append_additional_ncbi_taxa_id: FALSE

# --- Annotation resources (eggnog-mapper runs for every method) ---
eggnogmapper_db_dir: "resources/eggnogmapper/db"       # ~50 GB (full) or ~8 GB (bacteria only)
pfam_db_url:         "https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/pfamA.txt.gz"
cazy_db_url:         "https://pro.unl.edu/dbCAN2/download/Databases/CAZyDB.07302020.fam-activities.txt"
# eggnog6.embl.de now 301s to eggnogdb.org, which 404s for this file (and for
# the emapperdb-5.0.2 files); eggnog5.embl.de still serves both.
eggnog_db_url:       "http://eggnog5.embl.de/download/eggnog_5.0/e5.og_annotations.tsv"
# Base URL for the two emapper database files (eggnog.db, eggnog_proteins.dmnd),
# fetched by download_eggnogmapper_db. Declared here, not just read via
# config.get() in the rule, so the next host move is a visible one-line edit
# rather than an undocumented override nobody knows exists.
eggnogmapper_db_url: "http://eggnog5.embl.de/download/emapperdb-5.0.2"

# Authoritative term-name dictionaries used to fill `description` for the
# eggNOG-mapper-derived annotation types (go/kegg_*/pfam/ec_number/brite).
# Pinned to specific releases for reproducibility (recorded in the conduit
# object via resources/annotation/dictionaries/dictionary_versions.tsv).
# KEGG REST is live (no dated archive); the downloaded snapshot is cached in
# resources/ and its release is captured at download time.
go_obo_url:          "http://release.geneontology.org/2026-05-19/ontology/go-basic.obo"  # GO release 2026-05-19
kegg_rest_url:       "https://rest.kegg.jp"
enzyme_dat_url:      "https://ftp.expasy.org/databases/enzyme/enzyme.dat"
pfam_clans_url:      "https://ftp.ebi.ac.uk/pub/databases/Pfam/releases/Pfam37.0/Pfam-A.clans.tsv.gz"  # Pfam 37.0


# =============================================================================
#  PEPTIDOTYPING FAMILY
#  Used by: unipept_peptidotyping · unipept_hapiid · genome_peptidotyping
# =============================================================================
# Location of UMGAP-derived sequences.tsv.lz4 + taxons.tsv.lz4 (~170 GB combined).
# For per-machine off-repo storage, set PEPTIDOTYPING_RESOURCE_DIR env var when
# invoking via tests/run_integration_tests.sh — the runner injects --config.
peptidotyping_resource_dir: "resources/peptidotyping/"
# Location of the taxonkit NCBI-taxonomy database. Convention is this lives under
# peptidotyping_resource_dir (CLAUDE.md); the test runner derives it from
# PEPTIDOTYPING_RESOURCE_DIR if TAXONKIT_DB_DIR isn't set.
taxonkit_db_dir: "resources/peptidotyping/taxonkit"
# Scratch space for the UMGAP index build. Separate from the resource dir so
# the index can live on bulk storage while scratch lives on fast storage.
# GNU sort writes ~530 GB of spill files here in 4 KB units. On a native
# filesystem that runs at ~4 GB/s. On a 9p/CIFS/NFS mount -- notably /mnt/c
# under WSL, where each 4 KB write pays a 64 KB round trip -- it drops to
# ~11 MB/s, turning hours into days. Set this to a LOCAL disk on such hosts,
# e.g. --config peptidotyping_temp_dir=/var/tmp/conduit_peptidotyping_scratch
peptidotyping_temp_dir: "resources/peptidotyping/temp"
# Minimum diagnostic peptides per taxon required for it to enter the search database.
min_taxon_db_peptides: 10

# Filter chain applied to each peptidotyping pass, in order:
#   1. picked target-decoy FDR (Savitski et al. 2015) at the taxon level —
#      each lineage keeps only the higher-scoring of its {target, decoy} pair,
#      then all representatives compete in one ranked list. A lineage is called
#      present iff it is a target representative AND qvalue <= qvalue_threshold
#      AND n_unique_peptides_all >= min_peptides. See conduitR::pick_taxon_fdr.
#   2. score-coverage — *_score_fraction_threshold OR *_max_taxa (disabled by
#      default; an abundance-based top-N gate that drops low-abundance lineages
#      independent of FDR, so it is off for this recall-oriented first pass).
#
# Each gate is recorded in the per-pass *_fdr_results.tsv via the
# filter_reason column, so it's trivial to see which gate rejected which taxon.
#
# method — the presence-call rule:
#   "count" (default, recommended): a taxon is present iff it has at least
#       `min_confident_peptides` distinct CONFIDENT peptides (DIA-NN Q.Value
#       <= 0.01). This rests on DIA-NN's own precursor FDR (a real, validated
#       FDR) and does NOT use the reported decoy null at all — which is the
#       point: InfiniDIA's --pre-filter censors the reported decoys (~135 of
#       ~972k survive in the s76 2nd pass), so any decoy-magnitude statistic
#       (enrichment) is unreliable and any decoy-count FDR (qvalue) is thin /
#       quantized. Confident-peptide COUNT survives the censoring and cleanly
#       separates real taxa (10s-1000s of peptides) from noise (decoy taxa top
#       out ~16). Recall-oriented: the presence call is a candidate-selection
#       screen; close relatives sharing peptides ("congener halo") may ride
#       along and are resolved by the final full-proteome search.
#   "enrichment": per-peptide score >= margin x pooled decoy noise rate. BROKEN
#       under InfiniDIA — the censored decoy null inflates the noise rate and
#       drops true high-peptide-count organisms (e.g. E. coli in s76 -> empty
#       DB). Kept for provenance / non-InfiniDIA use only.
#   "qvalue": global ranked-list picked q-value gate (uses qvalue_threshold).
#       Recovers signal but its taxon-level q-value is NOT a trustworthy FDR
#       under the censored null (see docs); use "count".
peptidotyping_first_pass_method:  count
peptidotyping_second_pass_method: count
# margin — under method: enrichment, the multiple of the decoy noise rate a
# lineage's per-peptide score must exceed. It trades three things at once:
# lower margin -> higher recall, more false positives, and MORE families pass
# gate 1, which enlarges the gate-2 species/strain database. That database is
# searched library-free by DIA-NN, whose memory scales with the candidate
# peptide count, so an over-permissive margin can OOM the search.
# Calibrated on the equimolar defined-community pool (see supplementary
# margin-sweep figure): full 10/10 recovery spans M = 1.75-2.25 (the recall
# cliff, where E. coli/Phocaeicola drop at the species/strain gate, is at 2.5);
# the tractability floor is ~M = 1.75 (25 families / 11.9 GB; M = 1.5 -> 38
# families / 24.9 GB OOM'd at 126 GB on a 125 GB host). 2.0 sits centred in the
# full-recall plateau (max headroom from both the OOM floor and the recall
# cliff); 2.25 is the false-positive-minimal full-recall point.
peptidotyping_first_pass_margin:  2.0
peptidotyping_second_pass_margin: 2.0
# qvalue_threshold — picked q-value cutoff for a presence call under
# method: qvalue (ignored under method: enrichment). 0.05 is deliberately
# permissive: a lineage dropped here is unrecoverable in the later species /
# full-proteome stages, so the first pass favours recall.
peptidotyping_first_pass_qvalue_threshold:  0.05
peptidotyping_second_pass_qvalue_threshold: 0.05
# min_peptides — minimum distinct peptides (n_unique_peptides_all) required to
# call a lineage present. Raised from 2 to 10 to curb over-calling: at 2 the
# species/strain pass detected ~1100 taxa (many spurious). 10 distinct peptides
# is a much harder bar for a noise lineage to clear. NOTE: this gate counts
# n_unique_peptides_all (every contributing peptide regardless of PEP), not the
# confident (Q<=0.01) count — so it raises the bar but stays confidence-blind;
# gating on confident peptides is the deeper fix if 10 proves insufficient.
peptidotyping_first_pass_min_peptides:  10
peptidotyping_second_pass_min_peptides: 10
# min_confident_peptides — under method: count, the minimum number of distinct
# CONFIDENT peptides (DIA-NN Q.Value <= 0.01) a taxon must have to be called
# present. This is the count that "N peptides per taxon" usually means, and the
# gate rests on DIA-NN's validated precursor FDR. 10 favours recall: across the
# s75-s86 single-species controls every true organism had >=37 confident
# peptides while decoy taxa topped out at 16, so 10 recovers 9/9 with margin;
# raising toward 20 tightens the congener halo at a small recall cost on
# low-abundance members (validate on a complex sample before raising). Ignored
# unless method: count.
peptidotyping_first_pass_min_confident_peptides:  10
peptidotyping_second_pass_min_confident_peptides: 10
# Optional score-coverage filter applied to whatever survives the picked FDR.
# For each pass, set AT MOST ONE of *_score_fraction_threshold / *_max_taxa —
# setting both for the same pass is an error. Both null (the default) disables
# it — recommended, as it independently drops real low-abundance taxa.
#   *_score_fraction_threshold: keep the smallest top-by-score prefix of
#       FDR-passing taxa whose cumulative score reaches the given fraction
#       of the total score (HAPiID-style coverage filter).
#   *_max_taxa: keep the top-N FDR-passing taxa by score.
peptidotyping_first_pass_score_fraction_threshold: null
peptidotyping_first_pass_max_taxa: null
peptidotyping_second_pass_score_fraction_threshold: null
peptidotyping_second_pass_max_taxa: null


# =============================================================================
#  HAPiID
#  Used by: hapiid (incl. the mgnify-sourced variant)
# =============================================================================
# HMM profiles for marker-gene identification (ribosomal proteins, elongation factors).
hapiid_hmm_profiles: "resources/hapid/ribP_elonF_profiles_refined_manually.hmm"
# Greedy genome-selection cutoff — take the smallest set of genomes that covers this
# fraction of marker-gene-annotated spectra.
hapiid_percent_spectra: 80


# =============================================================================
#  Genome / bakta annotation
#  Used by: genomes · hapid · genome_peptidotyping
#           (any method that produces genomes to annotate, incl. mgnify_* variants)
# =============================================================================
# Bakta database location and variant.
# Bakta DB size: light ~2 GB, full ~84 GB. The light DB is sufficient for most
# bacterial-MAG workflows; use full only when you need plasmid/viral DBs.
bakta_db_dir:  "resources/bakta/db"
bakta_db_type: "light"

# =============================================================================
#  Shared genome-derived resource caches
#  Used by: genomes · hapid · genome_peptidotyping (when source == "mgnify")
# =============================================================================
# Sharing only kicks in when genome_download_source == "mgnify" — MGnify accessions
# are globally unique. For local genomes we keep per-run paths; local names aren't
# guaranteed unique across experiments.
#
# Per-genome artifacts (Prodigal/FGS FAA, HMMER tblout, bakta annotations).
# Layout: {genome_resource_dir}/{catalog_slug}/{tool}/{genome_id}/
genome_resource_dir: "resources/genome_databases/derived"
# Per-genome-set aggregates (LCA peptide DBs, hapid speclib + dedup marker DB).
# Layout: {genome_set_resource_dir}/{catalog_slug}__filter-{filter}__max{n}/{module}/
genome_set_resource_dir: "resources/genome_databases/derived_sets"


# =============================================================================
#  MetaPhlAn
#  Used by: metaphlan
# =============================================================================
metaphlan_database_dir: "resources/metaphlan"   # ~54 GB
# Minimum relative abundance to include a species from MetaPhlAn profiling.
relative_abundance_threshold: 0.01


# =============================================================================
#  MGnify genome download  (optional pre-step)
#  Activated when: genome_download_source == "mgnify"
#  Consumed by:    genomes · hapid · genome_peptidotyping (when the flag is set)
# =============================================================================
# Where to fetch genomes from. FALSE = user-provided genomes only. "mgnify" = download.
genome_download_source: FALSE
# MGnify catalog string. The string IS the version pin (no extra version key needed).
# e.g. "human-gut/v2.0.2", "chicken-gut/v1.0.1"
# Browse: https://www.ebi.ac.uk/metagenomics/browse/genomes
mgnify_catalog: ""
# FTP base — should not need to change.
mgnify_ftp_base: "https://ftp.ebi.ac.uk/pub/databases/metagenomics/mgnify_genomes"
# Optional GTDB-lineage substring filter. e.g. "p__Firmicutes". FALSE = no filter.
mgnify_taxonomy_filter: FALSE
# Optional cap on number of species representatives to download. 0 = no limit.
mgnify_max_genomes: 0
# Shared genome cache root — one subdir per catalog (phase-2 globalization).
# Multiple experiments using the same mgnify_catalog share one copy.
mgnify_cache_dir: "resources/genome_databases/mgnify"
