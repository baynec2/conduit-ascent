# ===============================
# Container images
# ===============================
containers:
  conduitr:     "docker://baynec2/conduitr:alpha"
  diann:        "docker://baynec2/diann2.1.0:alpha"
  bakta:        "docker://baynec2/bakta:alpha"
  metaphlan:    "docker://baynec2/metaphlan:alpha"
  eggnogmapper: "docker://baynec2/eggnogmapper:2.1.12"
  umgap:        "docker://baynec2/umgap:alpha"
  taxonkit:     "quay.io/biocontainers/taxonkit:0.20.0--h9ee0642_1"
# ===============================
# Experiment and file configuration
# ===============================
# Name of the experiment (used to locate the correct experiment directory)
experiment:
# Name of this analysis run (used to namespace all outputs under experiments/{experiment}/runs/{run_name}/)
# Allows multiple runs with different configs or methods to coexist in the same experiment directory.
run_name:
# Config file for generating DIA-NN spectral library (relative to main Snakefile)
generate_diann_spectral_library_config: config/generate_diann_spectral_library.cfg
# Config file for running DIA-NN search (relative to main Snakefile)
run_diann_config: config/run_diann.cfg
# Sample annotation file path (relative to experiment directory)
sample_annotation: input/sample_annotation.txt
# Output directory path (relative to experiment directory)
output_dir: output/
# ===============================
# Search space configuration
# ===============================
# Method to define the search space. Options:
# - "ncbi_taxonomy_id": Use NCBI taxonomy IDs
# - "uniprot_proteome_id": Use UniProt proteome IDs
# - "peptidotyping": First-pass search on species-specific peptides
# - "MAGs": Use metagenome-assembled genomes
# - "metaphlan": Use MetaPhlAn profiling
# - "16S": Use 16S rRNA sequences
search_space_method: ncbi_taxonomy_id
## Peptidotyping specific options
# If using peptidotyping, the number of unique peptides that must be identified to call a species present. 
presence_min_peptides: 3
presence_min_coverage: 0
min_taxon_db_peptides: 10
## Metaphlan specific options 
# If using sequencing-based methods, the minimum relative abundance to include a species
relative_abundance_threshold: 0.01
## Options for all workflows
# Optional: NCBI organism IDs to classify as 'host' rather than 'microbiome'.
# Set to FALSE or [] to treat all organisms as microbiome.
# Examples: Human = 9606, Mouse = 10090
host_organism_ids: []
# Optional: add an extra proteome ID (e.g., host reference)
# FALSE = None
# Examples: Human = UP000005640, Mouse C57/BL6 = UP000000589
append_additional_proteome_id: FALSE
# Optional: add an extra NCBI taxonomic ID (e.g., host species)
# FALSE = None
# Examples: Human = 9606, Mouse = 10090
append_additional_ncbi_taxa_id: FALSE
## Exclude from database
# This may be useful especially for peptidotyping. If it detects
# Optional: exclude proteome id from database
# FALSE = Mone
# Examples: Human = UP000005640, Mouse C57/BL6 = UP000000589
exclude_proteome_id: FALSE
# Optional: exclude ncbi_taxa_id from database
# FALSE = Mone
# Examples: Human = UP000005640, Mouse C57/BL6 = UP000000589
exclude_ncbi_taxa_id: FALSE
# ===============================
# Resource configuration. Allows the user to specify paths to any hefty resources if they already exist on system.
# If not, conduit will handle their download automatically if they are required by workflow user specifies.
# ===============================
# Peptidotyping resources
peptidotyping_resource_dir: "resources/peptidotyping/"
# Annotation resources. 
eggnog_database: "resources/annotation/eggnog/e5.og_annotations.tsv" # ~200mb
# Download URLs for external annotation databases.
# Update these if a newer version of a database is available.
pfam_db_url: "https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/pfamA.txt.gz"
cazy_db_url: "https://pro.unl.edu/dbCAN2/download/Databases/CAZyDB.07302020.fam-activities.txt"
eggnog_db_url: "http://eggnog6.embl.de/download/eggnog_5.0/e5.og_annotations.tsv"
# Resources for metaphlan strategy.
metaphlan_database_dir: "resources/metaphlan" # ~54 Gb
# Resources for peptidotyping strategy
unipept_sequences: "resources/databases/sequences.tsv.lz4" # ~ 1.46 Gb
unipept_taxons: "resources/databases/taxons.tsv.lz4"
# Resources needed for mags
bakta_db_dir: "resources/bakta/db" # ~ 84 GB
# Resources needed for eggNOG-mapper (used for sequence-based functional annotation)
eggnogmapper_db_dir: "resources/eggnogmapper/db" # ~50 GB (full) or ~8 GB (bacteria only)
# Specify the type of bakta database to use "full" (~84 Gb) or "light (~2Gb)"
bakta_db_type: "light" # ~ 84 GB
# Might not need this depending on how we want to call MAGs.
gbtk_database: "resources/gbtk" # ~140 GB

