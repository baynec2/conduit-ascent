# Shared flags for DIA-NN library-based (spectral-library) searches.
# Per-rule digest parameters (--cut, --missed-cleavages, --min-pep-len,
# --max-pep-len) are passed inline by the calling Snakemake rule because
# they differ between HAPiID marker-gene searches (trypsin, 7-30) and
# pre-digested peptide searches (no enzyme, 5-50).
--qvalue 0.01
--matrices
--unimod4
--mass-acc 10
--mass-acc-ms1 4
--species-ids
