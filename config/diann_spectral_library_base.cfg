# Shared flags for all DIA-NN spectral-library generation rules.
# Per-rule digest parameters (--cut, --missed-cleavages, --min-pep-len,
# --max-pep-len, --species-ids, --met-excision) are passed inline by the
# calling Snakemake rule because they vary by library purpose:
#   generate_diann_spectral_library              main search, trypsin, met-excision
#   create_hapid_profiling_spectral_library      HAPiID marker genes, trypsin
#   generate_hapid_spectral_library              unipept HAPiID, pre-digested peptides
--verbose 2
--qvalue 0.01
--gen-spec-lib
--predictor
--fasta-search
--min-fr-mz 200
--max-fr-mz 1800
--min-pr-mz 300
--max-pr-mz 1800
--min-pr-charge 1
--max-pr-charge 4
--unimod4
--mass-acc 10
--mass-acc-ms1 4
